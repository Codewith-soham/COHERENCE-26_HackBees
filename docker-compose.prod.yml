version: "3.8"

services:
  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: budgetguard-ai-prod
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=${FRONTEND_URL:-http://localhost},http://localhost:5000,http://backend:5000,http://localhost
    networks:
      - budgetguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgetguard-backend-prod
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
    depends_on:
      ai-service:
        condition: service_started
    networks:
      - budgetguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${API_BASE_URL:-http://localhost:5000}
    container_name: budgetguard-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - budgetguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  budgetguard-net:
    driver: bridge

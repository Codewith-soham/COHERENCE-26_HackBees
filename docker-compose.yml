version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: budgetguard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - budgetguard-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-service:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: budgetguard-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      # Allow calls from the backend container and localhost for dev
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5000,http://backend:5000,http://localhost
    networks:
      - budgetguard-net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).getcode()==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: budgetguard-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      # MongoDB reachable at the service name "mongodb"
      - MONGODB_URI=mongodb://mongodb:27017/budgetguard
      - JWT_SECRET=${JWT_SECRET:-your-secret-key-change-me-in-production}
      # AI service reachable at the service name "ai-service"
      - AI_SERVICE_URL=http://ai-service:8000
      - FRONTEND_URL=http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_started # or service_healthy, but ai loading models might take a moment
    networks:
      - budgetguard-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Assuming frontend is served via nginx, browser makes requests to backend
        # Using localhost assuming typical local deployment for testing
        # In actual production, this would be the public API URL
        - VITE_API_BASE_URL=http://localhost:5000
    container_name: budgetguard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - budgetguard-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:

networks:
  budgetguard-net:
    driver: bridge
